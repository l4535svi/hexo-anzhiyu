# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: Code Realm
subtitle: 码境
description: 记录技术折腾与分享
keywords: Code Realm, 码境, 技术博客
author: 码境科技
language: zh-CN
timezone: Asia/Shanghai

# URL — 部署时再改成真实域名
url: https://l4535.de5.net/
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Search (for theme local_search)
search:
  path: search.xml
  field: post
  content: true
  format: html

# Plugins
plugins:
  - hexo-generator-robotstxt

# Sitemap
sitemap:
  path:
    - sitemap.xml
  tags: true
  categories: true

# Feed (RSS/Atom)
feed:
  type: atom
  path: atom.xml
  limit: 20
  content: true
  content_limit: false
  order_by: -date
  autodiscovery: true

# robots.txt
robotstxt:
  useragent: "*"
  allow:
    - /
  sitemap: /sitemap.xml

# External links nofollow (own domains excluded)
nofollow:
  enable: true
  exclude:
    - l4535.de5.net
    - hexo-anzhiyu-chi.vercel.app
    - welcome4535.de5.net

# HTML minifier: keep original HTML when a page fails to parse
# (2 old Blogger posts contain malformed HTML and would otherwise render empty)
html_minifier:
  ignore_error: true

# Extensions
theme: anzhiyu

# Deployment (placeholder — fill in when deploying)
deploy:
  type: ''

# 追番插件 hexo-bilibili-bangumi
bangumi:
  enable: true
  source: bili
  path: bangumis/index.html
  vmid: 485156002
  title: '追番列表'
  quote: '生命不息，追番不止！'
  theme: auto
  show: 1
  lazyload: true
  webp: true
  progress: false
