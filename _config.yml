# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: Code Realm
subtitle: 码境
description: 记录技术折腾与分享
keywords: Code Realm, 码境, 技术博客
author: 码境科技
language: zh-CN
timezone: Asia/Shanghai

# URL — 部署时再改成真实域名
url: https://hexo-anzhiyu-chi.vercel.app/
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Search (for theme local_search)
search:
  path: search.xml
  field: post
  content: true
  format: html

# Extensions
theme: anzhiyu

# Deployment (placeholder — fill in when deploying)
deploy:
  type: ''
